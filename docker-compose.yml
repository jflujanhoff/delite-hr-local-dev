services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: delite_hr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # AWS emulator for local dev — the backend talks to this over S3_ENDPOINT_URL
  # via the same boto3 code path real AWS uses; only the endpoint differs.
  localstack:
    image: localstack/localstack:3
    environment:
      - SERVICES=s3
    ports:
      - "4566:4566"
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../delite-hr-backend
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: ../delite-hr-backend/.env
    environment:
      # Deliberate override of .env's STORAGE_ROOT (a host path, used when
      # running the backend outside Docker): inside this container the same
      # data is mounted at /storage by the volume line below, not the host
      # path. Keep this in sync with the identical override in
      # ../delite-hr-backend/docker-compose.yml's backend/celery_worker services.
      - STORAGE_ROOT=/storage
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/delite_hr
    volumes:
      - ../delite-hr-backend/backend:/app/backend
      - ../delite-hr-backend/storage:/storage
    command: >
      sh -c "alembic -c backend/alembic.ini upgrade head &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

  celery_worker:
    build:
      context: ../delite-hr-backend
      dockerfile: backend/Dockerfile
    env_file: ../delite-hr-backend/.env
    environment:
      - STORAGE_ROOT=/storage
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/delite_hr
    volumes:
      - ../delite-hr-backend/backend:/app/backend
      - ../delite-hr-backend/storage:/storage
    command: celery -A backend.worker worker --loglevel=info --concurrency=4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

  flower:
    image: mher/flower:2.0
    ports:
      - "5555:5555"
    env_file: ../delite-hr-backend/.env
    command: celery --broker=${CELERY_BROKER_URL} flower --port=5555
    depends_on:
      redis:
        condition: service_healthy

  # Dev-mode container (hot reload via `next dev`) — replaces the old
  # host-level `npm run dev` process start.sh used to manage via .frontend.pid.
  # Uses Dockerfile.dev (installs deps, runs `next dev`) instead of the repo's
  # main Dockerfile, purely to skip an unneeded production build on every
  # image rebuild — faster dev-loop iteration, nothing else. The main
  # Dockerfile's production build (what an eventual AWS deploy uses) works
  # correctly on its own; it was fixed independently of this dev setup.
  frontend:
    build:
      context: ../delite-hr-frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ../delite-hr-frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  localstack_data:
  frontend_node_modules:
  frontend_next_cache:
