services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: delite_hr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../delite-hr-backend
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: ../delite-hr-backend/.env
    environment:
      - STORAGE_ROOT=/storage
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/delite_hr
    volumes:
      - ../delite-hr-backend/backend:/app/backend
      - ../delite-hr-backend/storage:/storage
    command: >
      sh -c "alembic -c backend/alembic.ini upgrade head &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ../delite-hr-backend
      dockerfile: backend/Dockerfile
    env_file: ../delite-hr-backend/.env
    environment:
      - STORAGE_ROOT=/storage
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/delite_hr
    volumes:
      - ../delite-hr-backend/backend:/app/backend
      - ../delite-hr-backend/storage:/storage
    command: celery -A backend.worker worker --loglevel=info --concurrency=4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    image: mher/flower:2.0
    ports:
      - "5555:5555"
    env_file: ../delite-hr-backend/.env
    command: celery --broker=${CELERY_BROKER_URL} flower --port=5555
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
